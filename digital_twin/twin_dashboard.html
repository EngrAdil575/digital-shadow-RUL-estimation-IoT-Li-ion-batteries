<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battery Digital Twin Monitor</title>
<style>
:root{color-scheme:light;--page:#ffffff;--surface:#ffffff;--ink:#17212b;--ink2:#4d5966;--ink3:#7b8794;--grid:#e9edf1;--axis:#c5ccd4;
  --border:#e1e6eb;--wrap:#1c2a3a;--steel:#c9d0d8;--s1:#2a78d6;--s2:#eb6834;--good:#0ca30c;--warning:#fab219;--serious:#ec835a;--critical:#d03b3b;
  --num:Bahnschrift,"DIN Alternate","Roboto Condensed","Arial Narrow",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:22px 18px 28px}
header{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font:600 30px/1.1 var(--num);letter-spacing:.2px;margin:0 0 6px}
.sub{color:var(--ink2);font-size:13.5px;max-width:64ch}
.sets{display:inline-flex;border:1px solid var(--axis);border-radius:9px;overflow:hidden}
.sets:empty{display:none}
.sets button{font:inherit;border:0;background:#fff;color:var(--ink2);padding:7px 14px;cursor:pointer}
.sets button+button{border-left:1px solid var(--axis)}
.sets button[aria-pressed=true]{background:var(--wrap);color:#fff;font-weight:600}
.sets button:focus-visible{outline:2px solid var(--s1);outline-offset:-2px}
.replay{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.replay button,.replay select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--axis);border-radius:8px;padding:6px 12px;cursor:pointer}
.replay button{min-width:78px;font-weight:600;background:var(--wrap);color:#fff;border-color:var(--wrap)}
.replay button:focus-visible,.cellbtn:focus-visible,.replay select:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.replay input[type=range]{width:min(300px,46vw);accent-color:var(--wrap)}
.replay .now{min-width:118px;color:var(--ink2);font-family:var(--num);font-size:15px}
.top{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0;border:1px solid var(--border);border-radius:16px;margin-bottom:16px;overflow:hidden}
@media (max-width:900px){.top{grid-template-columns:1fr}.summary{border-left:0!important;border-top:1px solid var(--border)}}
.bench{padding:22px 16px 18px;min-width:0;display:flex;align-items:center}
.cells{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.cellbtn{font:inherit;color:inherit;background:none;border:0;padding:0 4px 4px;cursor:pointer;text-align:center;border-radius:12px;min-width:0}
.cellbtn svg{width:112px;height:214px;display:block;margin:0 auto;transition:transform .18s ease}
.cellbtn:hover svg{transform:translateY(-3px)}
.cellbtn[aria-pressed=true] svg{transform:translateY(-6px)}
@media (prefers-reduced-motion:reduce){.cellbtn svg{transition:none}}
.plate{height:8px;border-radius:4px;background:var(--steel);margin:-4px 14px 12px;position:relative}
.cellbtn[aria-pressed=true] .plate{background:var(--s1)}
.cname{font:600 17px/1.2 var(--num);letter-spacing:.3px}
.big{font:600 27px/1.15 var(--num);margin-top:6px}
.big small{font:400 12.5px system-ui,sans-serif;color:var(--ink3);margin-left:3px}
.line{color:var(--ink2);font-size:12.5px;margin-top:2px}
.line b{color:var(--ink);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:999px;padding:1px 9px 1px 7px;font-size:12px;color:var(--ink);white-space:nowrap;background:#fff}
.pill i{font-style:normal;font-size:11px}
.summary{border-left:1px solid var(--border);padding:6px 18px}
.stat{padding:11px 0;border-top:1px solid var(--grid)}
.stat:first-child{border-top:0}
.stat .lab{color:var(--ink2);font-size:12.5px}
.stat .val{font:600 24px/1.15 var(--num);margin-top:1px}
.stat .val small{font:400 13px system-ui,sans-serif;color:var(--ink2)}
.stat .note{color:var(--ink3);font-size:12px}
.grid{display:grid;gap:14px}
.charts{grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));margin-bottom:14px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;min-width:0}
h2{font:600 16px/1.2 var(--num);letter-spacing:.2px;margin:0}
.chead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 14px;align-items:baseline;margin-bottom:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--ink2);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.key{width:14px;height:0;border-top:2px solid;display:inline-block}
.key.band{height:9px;border:0;opacity:.25;border-radius:2px}
.plot{position:relative}
.plot svg{display:block;width:100%;height:230px}
.plot svg text{fill:var(--ink3);font-size:11px}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--axis);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 6px 18px rgba(23,33,43,.12);display:none;white-space:nowrap;z-index:2}
.tip b{font-weight:600}.tip div{display:flex;gap:10px;justify-content:space-between}
.alerts{max-height:262px;overflow:auto;margin:0;padding:0;list-style:none}
.alerts li{display:grid;grid-template-columns:auto auto 1fr;gap:4px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--grid);font-size:13px}
.alerts li:first-child{border-top:0}
.alerts .when{color:var(--ink3);font-size:12px;white-space:nowrap}
.empty{color:var(--ink3);font-size:13px;padding:10px 0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:right;padding:7px 10px;border-top:1px solid var(--grid);white-space:nowrap}
th{color:var(--ink2);font-weight:600;border-top:0}th:first-child,td:first-child{text-align:left}
footer{color:var(--ink3);font-size:12px;margin-top:14px;max-width:110ch}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title"></h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div class="sets" id="sets" role="group" aria-label="Dataset"></div>
    <div class="replay" role="group" aria-label="Replay controls">
      <button id="play" type="button">Play</button>
      <input id="slider" type="range" min="1" value="1" aria-label="Discharge cycle">
      <span class="now" id="now"></span>
      <label>Speed <select id="speed"><option value="600">1×</option><option value="250" selected>2×</option><option value="90">5×</option></select></label>
    </div>
  </header>

  <section class="top">
    <div class="bench"><div class="cells" id="mods" aria-label="Cells on the bench"></div></div>
    <div class="summary" id="kpis" aria-label="Group summary"></div>
  </section>

  <section class="grid charts">
    <div class="card"><div class="chead"><h2 id="t-soh"></h2><div class="legend" id="l-soh"></div></div><div class="plot" id="c-soh"></div></div>
    <div class="card"><div class="chead"><h2 id="t-rul"></h2><div class="legend" id="l-rul"></div></div><div class="plot" id="c-rul"></div></div>
    <div class="card"><div class="chead"><h2 id="t-soc"></h2><div class="legend" id="l-soc"></div></div><div class="plot" id="c-soc"></div></div>
    <div class="card"><div class="chead"><h2>Alerts and maintenance log</h2><div class="legend" id="l-al"></div></div><ul class="alerts" id="alerts"></ul></div>
  </section>

  <div class="card"><div class="chead"><h2 id="t-table"></h2></div><div class="tablewrap"><table id="table"></table></div></div>
  <footer id="foot"></footer>
</div>

    `<li><span class="when">Cycle ${a.k}</span>${pill(a.level)}<span><b>${a.module}</b>: ${a.msg}</span></li>`).join("")
    : `<li class="empty" style="display:block">No alerts yet.</li>`;

  $("table").innerHTML = `<tr><th>${U[0].toUpperCase() + U.slice(1)}</th><th>Status</th><th>Cycle</th><th>SOH, twin</th><th>SOH, measured</th><th>RUL, twin</th><th>90% band</th><th>RUL, actual</th><th>Peak temp.</th></tr>` +
    live.map(x => { const {m, i} = x; return `<tr><td>${m.name}</td><td>${pill(x.ended ? "ended" : status(m, i))}</td><td>${m.k[i]}</td><td>${pct(m.sohEst[i])}</td><td>${pct(m.soh[i])}</td>
      <td>${num(m.rulPred[i])}</td><td>${m.rulPred[i] == null ? "–" : num(m.rulLo[i]) + " to " + num(m.rulHi[i])}</td><td>${num(m.rul[i])}</td><td>${num(m.tmax[i], 1)} °C</td></tr>`; }).join("");
}

const NUMFONT = "Bahnschrift,'DIN Alternate','Roboto Condensed','Arial Narrow',sans-serif";
const STEEL = j => `<linearGradient id="st${j}" x1="0" x2="1"><stop offset="0" stop-color="#98a2ad"/><stop offset=".3" stop-color="#f1f4f7"/><stop offset=".6" stop-color="#c3cbd3"/><stop offset="1" stop-color="#8b95a0"/></linearGradient>`;
const SHADE = (id, c) => `<linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset=".3" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient>`;

function battery(name, f, st, j) {
  const lv = Math.max(0, Math.min(1, f)), c = `var(${STATUS[st].c})`, style = META.style || "bars";
  if (style === "bars") return batteryBars(lv, c, j);
  if (style === "module") return batteryModule(name, lv, c, j);
  return batteryGlass(lv, c, j);
}

function batteryGlass(lv, c, j) {
  // a clear cylindrical cell: the coloured content is the estimated health, the dark line is the end-of-life level
  const x = 20, y0 = 30, w = 72, h = 168, y = y0 + h * (1 - lv), eol = y0 + h * (1 - META.eolSoh);
  return `<svg viewBox="0 0 112 214" aria-hidden="true"><defs>${STEEL(j)}${SHADE("sh" + j)}
      <clipPath id="bd${j}"><rect x="${x}" y="${y0}" width="${w}" height="${h}" rx="16"/></clipPath></defs>
    <ellipse cx="56" cy="203" rx="40" ry="6" fill="#17212b" opacity=".10"/>
    <rect x="41" y="8" width="30" height="14" rx="5" fill="url(#st${j})"/><rect x="26" y="19" width="60" height="14" rx="6" fill="url(#st${j})"/>
    <rect x="${x}" y="${y0}" width="${w}" height="${h}" rx="16" fill="#f3f6f9"/>
    <g clip-path="url(#bd${j})"><rect x="${x}" y="${y}" width="${w}" height="${y0 + h - y}" fill="${c}"/>
      <ellipse cx="56" cy="${y}" rx="${w / 2}" ry="6" fill="#fff" opacity=".35"/>
      <rect x="${x}" y="${y0}" width="${w}" height="${h}" fill="url(#sh${j})"/>
      <rect x="${x + 9}" y="${y0 + 8}" width="7" height="${h - 16}" rx="3.5" fill="#fff" opacity=".45"/></g>
    <rect x="${x}" y="${y0}" width="${w}" height="${h}" rx="16" fill="none" stroke="#aeb7c1" stroke-width="2"/>
    <line x1="${x - 6}" x2="${x + w + 6}" y1="${eol}" y2="${eol}" stroke="#17212b" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="56" y="${Math.min(y0 + h - 14, Math.max(y + 30, y0 + 34))}" text-anchor="middle" fill="#fff" stroke="#17212b" stroke-opacity=".55" stroke-width="3" paint-order="stroke" style="font:600 21px ${NUMFONT}">${(100 * lv).toFixed(0)}%</text></svg>`;
}

function batteryBars(lv, c, j) {
  // the familiar battery symbol: five bars that empty from the top as health falls
  const x = 22, y0 = 30, w = 68, h = 166, pad = 9, n = 5, gap = 6, bh = (h - 2 * pad - gap * (n - 1)) / n, y = y0 + pad + (h - 2 * pad) * (1 - lv), eol = y0 + pad + (h - 2 * pad) * (1 - META.eolSoh);
  let slots = "", clip = "";
  for (let s = 0; s < n; s++) { const r = `x="${x + pad}" y="${y0 + pad + s * (bh + gap)}" width="${w - 2 * pad}" height="${bh}" rx="6"`; slots += `<rect ${r} fill="#e9edf1"/>`; clip += `<rect ${r}/>`; }
  return `<svg viewBox="0 0 112 214" aria-hidden="true"><defs><clipPath id="bs${j}">${clip}</clipPath></defs>
    <ellipse cx="56" cy="203" rx="38" ry="5" fill="#17212b" opacity=".08"/>
    <rect x="42" y="12" width="28" height="18" rx="6" fill="#17212b"/>
    <rect x="${x}" y="${y0}" width="${w}" height="${h}" rx="16" fill="#fff" stroke="#17212b" stroke-width="5"/>
    ${slots}<g clip-path="url(#bs${j})"><rect x="${x}" y="${y}" width="${w}" height="${y0 + h - y}" fill="${c}"/></g>
    <path d="M${x - 14} ${eol - 6}l9 6l-9 6z" fill="#17212b"/><path d="M${x + w + 14} ${eol - 6}l-9 6l9 6z" fill="#17212b"/></svg>`;
}

function batteryModule(name, lv, c, j) {
  // a storage-system style module: a box with two terminals, a ribbed case and a level window on the front
  const gx = 30, gy = 64, gw = 52, gh = 104, y = gy + gh * (1 - lv), eol = gy + gh * (1 - META.eolSoh);
  let ribs = ""; for (let r = 0; r < 4; r++) ribs += `<rect x="18" y="${178 + r * 5}" width="76" height="2" fill="#fff" opacity=".12"/>`;
  return `<svg viewBox="0 0 112 214" aria-hidden="true"><defs>${STEEL(j)}
      <linearGradient id="cs${j}" x1="0" x2="1"><stop offset="0" stop-color="#22344a"/><stop offset=".5" stop-color="#2f4864"/><stop offset="1" stop-color="#1a2838"/></linearGradient>
      <clipPath id="mw${j}"><rect x="${gx}" y="${gy}" width="${gw}" height="${gh}" rx="8"/></clipPath></defs>
    <ellipse cx="56" cy="204" rx="46" ry="5" fill="#17212b" opacity=".10"/>
    <rect x="24" y="14" width="18" height="16" rx="3" fill="url(#st${j})"/><rect x="70" y="14" width="18" height="16" rx="3" fill="url(#st${j})"/>
    <text x="33" y="11" text-anchor="middle" fill="#4d5966" style="font:700 12px system-ui,sans-serif">+</text><text x="79" y="11" text-anchor="middle" fill="#4d5966" style="font:700 12px system-ui,sans-serif">−</text>
    <rect x="10" y="26" width="92" height="176" rx="10" fill="url(#cs${j})"/>
    <rect x="10" y="26" width="92" height="24" rx="10" fill="#fff" opacity=".10"/>
    <text x="56" y="43" text-anchor="middle" fill="#fff" style="font:600 13px ${NUMFONT};letter-spacing:1.2px">${name}</text>
    <circle cx="90" cy="38" r="4" fill="${c}" stroke="#fff" stroke-width="1.5"/>
    <g clip-path="url(#mw${j})"><rect x="${gx}" y="${gy}" width="${gw}" height="${gh}" fill="#0a1119"/>
      <rect x="${gx}" y="${y}" width="${gw}" height="${gy + gh - y}" fill="${c}"/><rect x="${gx}" y="${y}" width="${gw}" height="3" fill="#fff" opacity=".35"/>
      <rect x="${gx + 5}" y="${gy}" width="5" height="${gh}" fill="#fff" opacity=".14"/></g>
    <rect x="${gx}" y="${gy}" width="${gw}" height="${gh}" rx="8" fill="none" stroke="#fff" stroke-opacity=".4"/>
    <line x1="${gx - 8}" x2="${gx + gw + 8}" y1="${eol}" y2="${eol}" stroke="#fff" stroke-width="2"/>
    <text x="56" y="${gy + gh - 10}" text-anchor="middle" fill="#fff" stroke="#0a1119" stroke-opacity=".5" stroke-width="3" paint-order="stroke" style="font:600 19px ${NUMFONT}">${(100 * lv).toFixed(0)}%</text>${ribs}</svg>`;
}

function legend(id, items) {
  $(id).innerHTML = items.map(([n, c, band]) => `<span><span class="key${band ? " band" : ""}" style="${band ? "background:" + c : "border-color:" + c}"></span>${n}</span>`).join("");
}

function ticks(lo, hi, n) {
  const span = hi - lo || 1, step0 = Math.pow(10, Math.floor(Math.log10(span / n))), err = span / n / step0;
  const step = step0 * (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1), out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}

function chart(id, o) {
  const el = $(id), W = Math.max(300, el.clientWidth || 520), H = 230, L = 46, R = 12, Tp = 10, B = 34;
  const all = o.series.flatMap(s => s.pts).filter(p => p.y != null).map(p => p.y)
    .concat(o.band ? o.band.hi.concat(o.band.lo).filter(p => p.y != null).map(p => p.y) : [], o.hline ? [o.hline.y] : []);
  let y0 = o.yMin != null ? o.yMin : Math.min(...all), y1 = o.yMax != null ? o.yMax : Math.max(...all);
  if (o.yPad && o.yPad[0] != null) y0 = Math.min(y0, o.yPad[0]);
  if (!isFinite(y0) || !isFinite(y1)) { y0 = 0; y1 = 1; }
  if (o.yMax == null) y1 += (y1 - y0) * 0.06 || 1; if (o.yMin == null) y0 -= (y1 - y0) * 0.04;
  const X = x => L + (W - L - R) * x / (o.xMax || 1), Y = y => Tp + (H - Tp - B) * (1 - (y - y0) / (y1 - y0 || 1));
  const path = pts => { let d = "", pen = false; for (const p of pts) { if (p.y == null) { pen = false; continue; } d += (pen ? "L" : "M") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1); pen = true; } return d; };
  let g = "";
  for (const t of ticks(y0 * o.scale, y1 * o.scale, 4)) { const y = Y(t / o.scale); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="${css("--grid")}"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${t}</text>`; }
  for (const t of ticks(0, o.xMax, 6)) g += `<text x="${X(t)}" y="${H - B + 15}" text-anchor="middle">${t}</text>`;
  g += `<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="${css("--axis")}"/><text x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle">${o.xLabel}</text>`;
  if (o.hline) { const y = Y(o.hline.y); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="${css("--critical")}" stroke-width="1"/><text x="${W - R - 2}" y="${y - 4}" text-anchor="end">${o.hline.label}</text>`; }
  if (o.band) { const hi = o.band.hi.filter(p => p.y != null), lo = o.band.lo.filter(p => p.y != null);
    if (hi.length > 1) g += `<path d="${path(hi)}L${lo.slice().reverse().map(p => X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1)).join("L")}Z" fill="${o.band.color}" opacity=".13"/>`; }
  for (const s of o.series) { g += `<path d="${path(s.pts)}" fill="none" stroke="${s.color}" stroke-width="${s.w}" stroke-linejoin="round" stroke-linecap="round"/>`;
    const last = s.pts.filter(p => p.y != null).pop(); if (last && s.w >= 2) g += `<circle cx="${X(last.x)}" cy="${Y(last.y)}" r="4" fill="${s.color}" stroke="${css("--surface")}" stroke-width="2"/>`; }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${$(id.replace("c-", "t-")).textContent}">${g}<line class="cross" y1="${Tp}" y2="${H - B}" stroke="${css("--axis")}" style="display:none"/><rect x="${L}" y="${Tp}" width="${W - L - R}" height="${H - Tp - B}" fill="transparent"/></svg><div class="tip"></div>`;
  const svg = el.firstChild, tip = el.lastChild, cross = svg.querySelector(".cross"), base = o.series[o.series.length - 1].pts;
  svg.onmousemove = e => {
    const box = svg.getBoundingClientRect(), px = (e.clientX - box.left) * W / box.width;
    if (!base.length) return;
    let n = 0, best = 1e9; base.forEach((p, k) => { const d = Math.abs(X(p.x) - px); if (d < best) { best = d; n = k; } });
    const x = base[n].x; cross.setAttribute("x1", X(x)); cross.setAttribute("x2", X(x)); cross.style.display = "";
    const rows = o.series.slice().reverse().map(s => { const p = s.pts.find(q => q.x === x); return p && p.y != null ? `<div><span><span class="key" style="border-color:${s.color}"></span> ${s.name}</span><b>${(p.y * o.scale).toFixed(o.dec)}${o.unit}</b></div>` : ""; }).join("");
    const bl = o.band && o.band.lo.find(q => q.x === x), bh = o.band && o.band.hi.find(q => q.x === x);
    tip.innerHTML = `<div style="color:var(--ink3)">${o.xLabel} ${Number.isInteger(x) ? x : x.toFixed(1)}</div>${rows}` + (bl && bl.y != null ? `<div><span>90% band</span><b>${bl.y.toFixed(0)} to ${bh.y.toFixed(0)}</b></div>` : "");
    tip.style.display = "block";
    const left = X(x) * box.width / W; tip.style.left = Math.min(left + 12, box.width - tip.offsetWidth - 4) + "px"; tip.style.top = "8px";
  };
  svg.onmouseleave = () => { tip.style.display = "none"; cross.style.display = "none"; };
}

function step(to) { T = Math.max(1, Math.min(META.grid.length, to)); render(); if (T >= META.grid.length) stop(); }
function stop() { clearInterval(timer); timer = null; $("play").textContent = "Play"; }
$("play").onclick = () => { if (timer) return stop(); if (T >= META.grid.length) T = 1; $("play").textContent = "Pause"; timer = setInterval(() => step(T + 1), +$("speed").value); };
$("speed").onchange = () => { if (timer) { stop(); $("play").click(); } };
$("slider").oninput = e => { stop(); step(+e.target.value); };
function use(s) {
  // switch dataset: every number on the page comes from the chosen set
  stop(); S = s; M = DATA.sets[s].modules; META = DATA.sets[s].meta; ALERTS = DATA.sets[s].alerts; U = META.unit; sel = 0;
  $("slider").max = META.grid.length; T = META.startT || 1;
  $("title").textContent = document.title = META.title; $("t-table").textContent = `Latest readings, all ${U}s`;
  $("subtitle").textContent = META.subtitle; $("foot").textContent = META.footnote;
  $("sets").innerHTML = DATA.sets.length < 2 ? "" : DATA.sets.map((d, n) => `<button type="button" aria-pressed="${n === s}" data-s="${n}">${d.meta.label}</button>`).join("");
  document.querySelectorAll("#sets button").forEach(b => b.onclick = () => use(+b.dataset.s));
  render();
}
addEventListener("resize", render);
use(0);
</script>
</body>
</html>
